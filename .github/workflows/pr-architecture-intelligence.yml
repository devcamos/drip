name: PR Architecture Intelligence

on:
  pull_request:
    # `synchronize` reruns the review whenever new commits are pushed to an open PR.
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-architecture-intelligence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # TEST ONLY: pin to pr-intelligence#8 (00c124400fa6677aa31c0487efc573fec5d41bbd) to trial the tightened gate.
    # Revert this `uses:` line to @v1 and remove `tool-ref` before merging #84, after v1 is released.
    uses: devonte-amos-apps/pr-intelligence/.github/workflows/pr-architecture-intelligence.yml@00c124400fa6677aa31c0487efc573fec5d41bbd
    with:
      rules-path: architecture-rules.json
      node-version: "24.22.1"
      dependency-cruiser-dirs: app lib server
      tool-ref: 00c124400fa6677aa31c0487efc573fec5d41bbd
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
