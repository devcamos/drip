name: PR Architecture Intelligence

on:
  pull_request:
    # `synchronize` reruns the review whenever new commits are pushed to an open PR.
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-architecture-intelligence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # Skip the AI review on Dependabot PRs (no secrets there, and it adds noise).
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
    uses: devonte-amos-apps/pr-intelligence/.github/workflows/pr-architecture-intelligence.yml@v1
    with:
      rules-path: architecture-rules.json
      node-version: "24.22.1"
      dependency-cruiser-dirs: app lib server
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
