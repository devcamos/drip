name: PR Architecture Intelligence

on:
  pull_request:
    # `synchronize` reruns the review whenever new commits are pushed to an open PR.
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-architecture-intelligence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # TEST ONLY: pin to pr-intelligence#8 (4078cfc354ef1460e3a055f40ea4023c5f4f3f3b) to trial the tightened gate.
    # Revert this `uses:` line to @v1 and remove `tool-ref` before merging #84, after v1 is released.
    uses: devonte-amos-apps/pr-intelligence/.github/workflows/pr-architecture-intelligence.yml@4078cfc354ef1460e3a055f40ea4023c5f4f3f3b
    with:
      rules-path: architecture-rules.json
      node-version: "24.22.1"
      dependency-cruiser-dirs: app lib server
      tool-ref: 4078cfc354ef1460e3a055f40ea4023c5f4f3f3b
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
