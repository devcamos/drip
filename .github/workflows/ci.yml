name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Security audit (fails on high or critical)
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - name: Unit + integration + component coverage (app and server ≥85%, lib ≥90/85)
        run: npm test
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('coverage/**') != ''
        with: { name: coverage-report, path: coverage, if-no-files-found: error }
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: test-results }
