name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: drip_test
          POSTGRES_DB: drip_notifications_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Security audit (fails on high or critical)
        run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: All-feature regression evidence, coverage, real Postgres, build and browser tests
        run: npm run test:regression
        env:
          DRIP_TEST_DATABASE_URL: postgresql://drip_test@127.0.0.1:5432/drip_notifications_test
          REGRESSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regression-evidence
          path: |
            regression-results
            coverage
            test-results
